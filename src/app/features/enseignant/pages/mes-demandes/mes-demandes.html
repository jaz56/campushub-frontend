<div class="min-h-screen bg-gray-50">
  <app-header titre="Demandes de Documents 📄" sousTitre="Gérez vos demandes de documents administratifs"
    [retourRoute]="'/enseignant/dashboard'">
    <button (click)="ouvrirNouvelleDemandeModal()"
      class="px-6 py-3 bg-gradient-to-r from-primary to-secondary text-white rounded-lg font-semibold hover:shadow-lg transition flex items-center gap-2">
      <span>➕</span> Nouvelle demande
    </button>
  </app-header>

  <div class="p-8 max-w-7xl mx-auto">
    <div *ngIf="loading" class="flex justify-center items-center h-64">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
    </div>

    <div *ngIf="!loading">
      <div *ngIf="demandes.length === 0" class="bg-white rounded-xl border border-gray-200 p-16 text-center shadow-sm">
        <div class="text-6xl mb-4">📭</div>
        <h3 class="text-xl font-bold text-gray-900 mb-2">Aucune demande en cours</h3>
        <p class="text-gray-600 mb-6">Vous n'avez soumis aucune demande administrative récemment.</p>
        <button (click)="ouvrirNouvelleDemandeModal()"
          class="bg-white border-2 border-primary text-primary px-8 py-3 rounded-lg font-semibold hover:bg-primary hover:text-white transition">
          Faire une demande
        </button>
      </div>

      <div *ngIf="demandes.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let demande of demandes"
          class="bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow p-6 relative overflow-hidden group">
          <div class="absolute top-0 left-0 w-1 h-full" [ngClass]="getStatutClass(demande.status).split(' ')[0]"></div>

          <div class="flex items-start justify-between mb-4">
            <h3 class="font-bold text-lg text-gray-900 leading-tight">{{ demande.type }}</h3>
            <span class="px-2.5 py-1 rounded-full text-xs font-semibold border flex items-center gap-1 shrink-0"
              [ngClass]="getStatutClass(demande.status)">
              {{ getStatutIcon(demande.status) }} {{ getStatutLabel(demande.status) }}
            </span>
          </div>

          <p *ngIf="demande.message"
            class="text-gray-600 text-sm mb-4 line-clamp-3 bg-gray-50 p-3 rounded-lg border border-gray-100">{{
            demande.message }}</p>

          <div class="flex items-center text-xs text-gray-400 mt-auto pt-4 border-t border-gray-50">
            <span>📅 {{ demande.submittedAt | date:'dd MMM yyyy à HH:mm' }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Nouvelle Demande -->
<div *ngIf="showModal"
  class="fixed inset-0 bg-gray-900 bg-opacity-50 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-all">
  <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl transform scale-100 transition-transform">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-2xl font-bold text-gray-900">Nouvelle demande</h3>
      <button (click)="fermerModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Type de document</label>
        <select [(ngModel)]="nouveauType"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white transition-colors cursor-pointer appearance-none">
          <option value="">Sélectionnez un document...</option>
          <option value="WORK_CERTIFICATE">Attestation de travail</option>
          <option value="PAYSLIP">Fiche de paie</option>
          <option value="LEAVE_REQUEST">Demande de congé</option>
          <option value="TEACHING_MATERIAL">Matériel pédagogique</option>
          <option value="OTHER">Autre</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Précisions (optionnel)</label>
        <textarea [(ngModel)]="nouveauMessage" rows="4" placeholder="Ajoutez des détails si nécessaire..."
          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white transition-colors resize-none">
        </textarea>
      </div>
    </div>

    <div class="flex gap-3 mt-8">
      <button (click)="fermerModal()"
        class="flex-1 bg-white border-2 border-gray-200 text-gray-700 py-3 rounded-xl text-sm font-bold hover:bg-gray-50 hover:border-gray-300 transition-all">
        Annuler
      </button>
      <button (click)="soumettreDemande()" [disabled]="!nouveauType"
        class="flex-1 bg-primary text-white py-3 rounded-xl text-sm font-bold shadow-lg hover:bg-blue-800 hover:shadow-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-primary disabled:hover:shadow-lg">
        Envoyer la demande
      </button>
    </div>
  </div>
</div>
